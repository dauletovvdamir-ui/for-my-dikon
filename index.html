<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Приглашение</title>

<style>
body {
    background: linear-gradient(135deg, #ff9eb5, #ffc3d1);
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
}

/* карточка */
.container {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    padding: 35px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
    max-width: 420px;
    width: 90%;
    animation: fadeIn 0.8s ease;
}

/* гиф */
img {
    width: 240px;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* большая гиф */
#successScreen img {
    width: 340px;
}

/* текст */
h1 {
    color: #c62828;
    font-size: 22px;
    line-height: 1.6;
}

/* кнопки */
.buttons {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-top: 25px;
}

button {
    border: none;
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
    font-weight: bold;
}

#yesBtn {
    background: linear-gradient(135deg, #4CAF50, #66bb6a);
    color: white;
    box-shadow: 0 5px 15px rgba(76,175,80,0.4);
}

#yesBtn:hover {
    transform: scale(1.15);
}

#noBtn {
    background: linear-gradient(135deg, #f44336, #ff6b6b);
    color: white;
    box-shadow: 0 5px 15px rgba(244,67,54,0.4);
}

#noBtn:hover {
    transform: scale(0.95);
}

.success {
    display: none;
}

/* анимация */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
</style>
</head>

<body>

<div class="container" id="mainCard">
    <img src="https://i.imgur.com/bZZDB4c.gif">
    <h1>Қозы Көрпеш Баян Сұлу күнін бірге өткіземіз бе?</h1>

    <div class="buttons">
        <button id="yesBtn">Иә 😍</button>
        <button id="noBtn">Жоооқ</button>
    </div>
</div>

<div class="container success" id="successScreen">
    <img src="https://i.pinimg.com/originals/05/b4/36/05b4369c0d8d79bca1452a74fb6a5cbe.gif">

    <h1>
        Құрметті Динара🫶🏻 <br>
        Сізді Қозы Көрпеш Баян Сұлу мерекесін бірге өткізуге шақырамын <br><br>
        📅 Дата: 15.04.2026 <br>
        📍 Өтетін орны: что-то там <br><br>
        👗 Дресс код: қандай киім кисең де сұлусың ғой❤️ <br>
        🎉 Өзіңмен керемет көңіл-күй ала қойыңыз🫂 <br><br>
        Құрметпен, Дамир🫦
    </h1>
</div>

<script>
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
const mainCard = document.getElementById('mainCard');
const successScreen = document.getElementById('successScreen');

let yesFontSize = 16;
const phrases = ["?", "Клубника в шоколаде?", "Киноға апарамын", "Сенімдісің бе?", "Өтінемін...", "Ойланшы!", "Оте өтінемін!", "Мәәә...", "Жоқ демеші"];
let phraseIndex = 0;

noBtn.addEventListener('click', () => {
    yesFontSize += 10;
    yesBtn.style.fontSize = yesFontSize + 'px';

    noBtn.innerText = phrases[phraseIndex];
    phraseIndex = (phraseIndex + 1) % phrases.length;
});

yesBtn.addEventListener('click', () => {
    mainCard.style.display = 'none';
    successScreen.style.display = 'block';
});
</script>

</body>
</html>
